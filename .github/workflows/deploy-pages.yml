name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'benchmarks/results/dashboard.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages Artifacts
        run: |
          mkdir -p _site/benchmarks/results
          cp benchmarks/results/dashboard.html _site/index.html
          cp benchmarks/results/dashboard.html _site/benchmarks/results/dashboard.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Artifact Indexing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 15); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts | map(select(.name == "github-pages")) | length' 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "Artifact 'github-pages' indexed (attempt $i)."
              exit 0
            fi
            sleep 2
          done
          echo "Warning: artifact not yet visible after 30s; proceeding to deploy-pages."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
